[project]
name = "day36-google-adk"
version = "0.1.0"
requires-python = ">=3.12, <3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "edge-tts>=7.3.1",
    "google-adk>=2.14.1",
    "google-cloud-aiplatform[adk,agent-engines]>=2.9.0",
    "ipykernel>=7.4.0",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[[tool.uv.index]]
url = "https://pypi.apple.com/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
